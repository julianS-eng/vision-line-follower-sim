[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vision-line-follower"
version = "0.1.0"
description = "Simulated differential-drive line-following robot using classical computer vision (OpenCV) and comparative control (PID, Pure Pursuit, Stanley)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "vision-line-follower-sim contributors" }]
keywords = [
    "computer-vision",
    "robotics",
    "line-follower",
    "opencv",
    "simulation",
    "control-systems",
]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9,<5.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vision_line_follower"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

[tool.mypy]
# No pinned python_version: let mypy infer it from the interpreter that
# runs it, so CI's 3.11/3.12 matrix each check stubs (e.g. numpy's, which
# use 3.12-only "type" statement syntax) against their own version instead
# of a fixed target that breaks the 3.12 leg.
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
